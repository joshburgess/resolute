name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Matches the hard-coded port that pg-wired, pg-pool, resolute, and
  # resolute-cli integration tests all connect to (127.0.0.1:54322).
  TEST_DB_HOST: 127.0.0.1
  TEST_DB_PORT: 54322
  TEST_DB_USER: postgres
  TEST_DB_PASS: postgres
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Create test database and apply fixtures
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres \
            -c "CREATE DATABASE postgrest_test;"
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres \
            -d postgrest_test -f tests/fixtures/schema.sql

      - name: Clippy
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgrest_test
        run: cargo clippy --workspace --all-targets -- -Dwarnings

  test:
    name: test (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create test database and apply fixtures
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres \
            -c "CREATE DATABASE postgrest_test;"
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres \
            -d postgrest_test -f tests/fixtures/schema.sql

      - name: Build
        env:
          # Required so resolute-macros can resolve query metadata against the
          # seeded test database at compile time.
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgrest_test
        run: cargo build --workspace --all-targets

      # pg-wired-js is excluded: its lib unittest binary fails to start on
      # Linux with `symbol lookup error: undefined symbol:
      # napi_call_threadsafe_function`. napi symbols are only resolved when
      # loaded inside a JS host (Node/Bun/Deno). Tests for that crate live
      # in the JS test runner.
      - name: Unit + integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgrest_test
        run: cargo test --workspace --exclude pg-wired-js --all-targets -- --nocapture

      - name: Doc tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgrest_test
        run: cargo test --workspace --exclude pg-wired-js --doc

  doc:
    name: doc (warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs with warnings as errors
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      # Ignored advisories (each documented in .cargo/audit.toml):
      #   RUSTSEC-2023-0071: rsa Marvin attack. Transitive via sqlx-postgres
      #     (dev-dep only, used in benches against a local DB; no remote
      #     attacker can observe timing). No upstream patch available.
      #   RUSTSEC-2026-0097: rand unsoundness with custom logger. Triggers
      #     only when a logger calls rand::rng() inside log output; resolute
      #     does not register a custom logger, and dev-deps that pull rand
      #     don't either.
      - name: Run cargo audit
        run: cargo audit

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # MSRV applies to library + binary consumers, not to dev-dependencies
      # used only by our own tests/benches. We deliberately skip --all-targets
      # so dev-dep drift (newer crates that require post-1.85 toolchains)
      # doesn't break our public MSRV promise.
      - name: Check workspace builds on declared MSRV
        run: cargo check --workspace --locked --lib --bins

  test-tls-feature:
    name: test (pg-wired tls feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p pg-wired --features tls
      - run: cargo test -p pg-wired --features tls --lib

  test-tls-runtime:
    name: test (TLS runtime against TLS-enabled postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate CA + server cert chain
        run: |
          mkdir -p tls-fixture
          cd tls-fixture
          # Self-signed root CA
          openssl req -newkey rsa:2048 -nodes -x509 -days 365 \
            -subj "/CN=resolute-test-ca" \
            -keyout ca.key -out ca.crt
          # Server key + CSR
          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=localhost" \
            -keyout server.key -out server.csr
          # CA-signed server cert with SAN
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > server.ext
          openssl x509 -req -in server.csr \
            -CA ca.crt -CAkey ca.key -CAcreateserial \
            -days 365 -out server.crt -extfile server.ext
          # The test trusts the CA, not the server cert directly.
          openssl x509 -in ca.crt -outform DER -out ca.crt.der

      - name: Write Postgres TLS config
        run: |
          cat > tls-fixture/postgresql.conf <<'EOF'
          listen_addresses = '*'
          ssl = on
          ssl_cert_file = '/etc/postgres-tls/server.crt'
          ssl_key_file  = '/etc/postgres-tls/server.key'
          password_encryption = 'scram-sha-256'
          EOF
          cat > tls-fixture/pg_hba.conf <<'EOF'
          # local socket access (used by docker-entrypoint init)
          local all all trust
          # Reject plain TCP. Force TLS for all remote connections.
          hostnossl all all 0.0.0.0/0 reject
          hostnossl all all ::/0      reject
          hostssl   all all 0.0.0.0/0 scram-sha-256
          hostssl   all all ::/0      scram-sha-256
          EOF

      - name: Build and start TLS Postgres on :54323
        run: |
          # Build a tiny derived image so chown/chmod happen inside the
          # container as root, avoiding host-side sudo on the bind mount.
          cat > tls-fixture/Dockerfile <<'EOF'
          FROM postgres:17-alpine
          COPY server.crt server.key /etc/postgres-tls/
          COPY postgresql.conf pg_hba.conf /etc/postgresql/
          RUN chown postgres:postgres \
                  /etc/postgres-tls/server.crt /etc/postgres-tls/server.key \
                  /etc/postgresql/postgresql.conf /etc/postgresql/pg_hba.conf \
              && chmod 600 /etc/postgres-tls/server.key \
              && chmod 644 /etc/postgres-tls/server.crt \
                  /etc/postgresql/postgresql.conf /etc/postgresql/pg_hba.conf
          EOF
          docker build -t pg-wired-tls-test:ci tls-fixture
          docker run -d --name pg-tls \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54323:5432 \
            pg-wired-tls-test:ci \
            -c config_file=/etc/postgresql/postgresql.conf \
            -c hba_file=/etc/postgresql/pg_hba.conf
          for _ in $(seq 1 30); do
            if docker exec pg-tls pg_isready -U postgres -h 127.0.0.1; then
              break
            fi
            sleep 1
          done
          docker exec pg-tls pg_isready -U postgres -h 127.0.0.1

      - name: Start plaintext Postgres on :54322 (for the negative test)
        run: |
          docker run -d --name pg-plain \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            postgres:17-alpine
          for _ in $(seq 1 30); do
            if docker exec pg-plain pg_isready -U postgres -h 127.0.0.1; then
              break
            fi
            sleep 1
          done

      - name: Create test databases and apply fixtures
        run: |
          docker exec pg-tls psql -U postgres -d postgres \
            -c "CREATE DATABASE postgrest_test;"
          docker exec -i pg-tls psql -U postgres -d postgrest_test \
            < tests/fixtures/schema.sql
          docker exec pg-plain psql -U postgres -d postgres \
            -c "CREATE DATABASE postgrest_test;"
          docker exec -i pg-plain psql -U postgres -d postgrest_test \
            < tests/fixtures/schema.sql

      - name: Run TLS runtime integration test
        env:
          RESOLUTE_TLS_TEST_ADDR: 127.0.0.1:54323
          RESOLUTE_TLS_TEST_CA_DER: ${{ github.workspace }}/tls-fixture/ca.crt.der
          RESOLUTE_TEST_ADDR: 127.0.0.1:54322
        run: cargo test -p pg-wired --features tls --test tls_test -- --nocapture

  test-md5-auth:
    name: test (md5 password auth)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          # pg_hba entries become "md5" instead of the default "scram-sha-256",
          # so connections negotiate md5 auth when the stored hash is md5.
          POSTGRES_HOST_AUTH_METHOD: md5
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Postgres still starts with the default password_encryption=scram-sha-256,
      # so the bootstrap postgres user's password is stored as a SCRAM hash. PG
      # falls back to SCRAM if the stored hash is SCRAM even when pg_hba says
      # md5; to actually exercise the md5 code path we re-store the password
      # under md5 encryption.
      - name: Reconfigure postgres password as md5
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c \
            "ALTER SYSTEM SET password_encryption = 'md5';"
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c \
            "SELECT pg_reload_conf();"
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c \
            "ALTER USER postgres WITH PASSWORD 'postgres';"
          # Confirm: rolpassword should now start with 'md5' rather than
          # 'SCRAM-SHA-256$'. If this assertion fails, the test below would
          # silently pass via SCRAM fallback.
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -tAc \
            "SELECT substring(rolpassword, 1, 3) FROM pg_authid WHERE rolname = 'postgres';" \
            | grep -q '^md5$'

      - name: Create test database and apply fixtures
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres \
            -c "CREATE DATABASE postgrest_test;"
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres \
            -d postgrest_test -f tests/fixtures/schema.sql

      - name: Run pg-wired tests under md5 auth
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgrest_test
        run: cargo test -p pg-wired --tests

  # Note: SCRAM-SHA-256-PLUS (channel binding) coverage requires a TLS-enabled
  # Postgres in CI. That work is tracked separately and will land in the same
  # change as the integration test for the `tls` feature.
  #
  # Note: pg-wired-js has its own Node/Bun/Deno smoke tests. The CI job for it
  # lands in the TypeScript-conversion PR (it references scripts added there).
