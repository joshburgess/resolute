[workspace]
members = ["pg-wired", "pg-wired-js", "pg-pool", "resolute", "resolute-derive", "resolute-macros", "resolute-cli"]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Josh Burgess <joshualoganburgess@gmail.com>"]
repository = "https://github.com/joshburgess/resolute"
homepage = "https://github.com/joshburgess/resolute"

# Internal path dependencies carry both `path` (for local workspace builds)
# and `version` (required for crates.io publish: cargo strips `path` on upload
# and falls back to the registry version). Bump versions here on release.
[workspace.dependencies]
pg-wired = { path = "pg-wired", version = "0.3.0" }
pg-pool = { path = "pg-pool", version = "0.3.0" }
resolute = { path = "resolute", version = "0.4.0", default-features = false }
resolute-derive = { path = "resolute-derive", version = "0.1.0" }
resolute-macros = { path = "resolute-macros", version = "0.2.0" }
