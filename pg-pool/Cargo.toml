[package]
name = "pg-pool"
version = "0.1.0"
description = "Async PostgreSQL connection pool built on pg-wired."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["postgres", "postgresql", "pool", "connection-pool", "async"]
categories = ["database", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
bytes = "1"

# Optional pg-wired integration
pg-wired = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
pg-wired = { workspace = true }

[features]
default = ["wire"]
wire = ["pg-wired"]
