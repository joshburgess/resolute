[package]
name = "pg-pool"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
bytes = "1"

# Optional pg-wired integration
pg-wired = { path = "../pg-wired", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
pg-wired = { path = "../pg-wired" }

[features]
default = ["wire"]
wire = ["pg-wired"]
