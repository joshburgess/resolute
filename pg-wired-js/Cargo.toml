[package]
name = "pg-wired-js"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
# napi symbols are only resolvable when loaded inside a JS host (Node, Bun,
# Deno). The Rust unittest binary links against napi but has no runtime to
# satisfy the symbols, so on Linux it fails to start with `symbol lookup
# error: undefined symbol: napi_call_threadsafe_function`. Tests for this
# crate live in the JS test runner (see scripts/), not `cargo test`.
test = false
doctest = false

[dependencies]
pg-wired = { workspace = true, features = ["tls"] }
napi = { version = "2", default-features = false, features = ["napi9", "async", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
bytes = "1"
serde_json = "1"

[build-dependencies]
napi-build = "2"
