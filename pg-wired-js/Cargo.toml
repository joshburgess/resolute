[package]
name = "pg-wired-js"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pg-wired = { workspace = true, features = ["tls"] }
napi = { version = "2", default-features = false, features = ["napi9", "async", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
bytes = "1"
serde_json = "1"

[build-dependencies]
napi-build = "2"
