[package]
name = "resolute-derive"
version = "0.1.0"
description = "Derive macros for resolute (FromRow, PgEnum, PgComposite, PgDomain)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/resolute-derive"
readme = "README.md"
keywords = ["postgres", "postgresql", "derive", "macro", "resolute"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
