[package]
name = "resolute-macros"
version = "0.1.0"
description = "Compile-time-checked query! macro for resolute."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/resolute-macros"
readme = "README.md"
keywords = ["postgres", "postgresql", "sql", "macro", "resolute"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
pg-wired = { workspace = true }
bytes = "1"
tokio = { version = "1", features = ["rt", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Feature flags are propagated from `resolute`. When a feature is disabled,
# the corresponding PostgreSQL OIDs (e.g. timestamp/uuid/jsonb) produce a
# helpful compile error instead of a confusing downstream type mismatch.
chrono = []
json = []
uuid = []
