[package]
name = "resolute-macros"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
pg-wired = { path = "../pg-wired" }
bytes = "1"
tokio = { version = "1", features = ["rt", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Feature flags are propagated from `resolute`. When a feature is disabled,
# the corresponding PostgreSQL OIDs (e.g. timestamp/uuid/jsonb) produce a
# helpful compile error instead of a confusing downstream type mismatch.
chrono = []
json = []
uuid = []
