[package]
name = "resolute"
version = "0.2.0"
description = "Compile-time-checked PostgreSQL queries with a pure-Rust wire protocol driver."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/resolute"
readme = "README.md"
keywords = ["postgres", "postgresql", "sql", "database", "async"]
categories = ["database", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
pg-wired = { workspace = true }
resolute-derive = { workspace = true }
resolute-macros = { workspace = true }
pg-pool = { workspace = true }
bytes = "1"
thiserror = "2"
tracing = "0.1"
arc-swap = "1"
tokio-stream = "0.1"
tokio = { version = "1", features = ["sync", "fs", "time"] }
rand = "0.9"
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
serde_json = { version = "1", optional = true }
uuid = { version = "1", optional = true }

[dev-dependencies]
# Self-dep with test-utils enabled so the crate's own tests (and the
# `resolute::test` attribute macro expansion) can access `test_db`.
resolute = { path = ".", features = ["test-utils"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
trybuild = "1"
tempfile = "3"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }

[[bench]]
name = "encode_decode"
harness = false

[[bench]]
name = "query_latency"
harness = false

[[bench]]
name = "concurrent_load"
harness = false

[features]
default = ["chrono", "json", "uuid"]
chrono = ["dep:chrono", "resolute-macros/chrono"]
json = ["dep:serde_json", "resolute-macros/json"]
uuid = ["dep:uuid", "resolute-macros/uuid"]
# Exposes the `test_db` module for downstream crates that want to use
# resolute's ephemeral-database helpers in their own test suites. Also enabled
# automatically by the `resolute::test` attribute macro expansion.
test-utils = []
