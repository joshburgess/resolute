[package]
name = "stalwart-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stalwart-cli"
path = "src/main.rs"

[dependencies]
pg-wired = { path = "../pg-wired" }
tokio = { version = "1", features = ["rt", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3"
